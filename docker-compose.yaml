version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - backend-network
    depends_on:
      - redis
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server","--requirepass","password"]
    volumes:
      - redis-data:/data
    networks:
      - backend-network

volumes:
  redis-data:
networks:
  backend-network:
    